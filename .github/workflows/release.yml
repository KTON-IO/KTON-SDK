name: Release

# Push a tag such as v2.0.0 (or v2.1.0-beta.1 for a prerelease) whose version
# matches package.json and has a "## [2.0.0]" section in CHANGELOG.md.
#
# npm trusts this workflow (trusted publishing, no token) to stage a version
# only: it goes live once a maintainer approves it under Staged Packages on
# npmjs.com, or with `npm stage approve <id>`, either way with 2FA.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # The notes are the version's CHANGELOG.md section, followed by the list
      # of merged PRs that GitHub generates. Checked before anything is published.
      - name: Release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - run: npm run typecheck && npm run check && npm run test:run && npm run build
      # Staged publishing needs npm 11.15.0 or later.
      - name: npm version
        run: node -e 'const [a, b] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && b < 15)) { console.error(`npm ${process.argv[1]} cannot stage`); process.exit(1) }' "$(npm --version)"
      # A version already published by hand is left as it is.
      - name: Stage on npm
        run: |
          if npm view "kton-sdk@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "kton-sdk@${GITHUB_REF_NAME#v} is already on npm"
          else
            npm stage publish --provenance --access public ${{ contains(github.ref_name, '-') && '--tag next' || '' }}
          fi
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes ${{ contains(github.ref_name, '-') && '--prerelease' || '' }} dist/kton-sdk.global.js
        env:
          GH_TOKEN: ${{ github.token }}
