<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KTON SDK demo</title>
  <link rel="icon" href="icon.png">
  <script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@3.0.2/dist/tonconnect-ui.min.js" integrity="sha384-BTareOTsWX/2zcVxklvKhoTWnYXs1NbbMON7wL80t6xeld55HGlSS/oBJmrEvNG9" crossorigin="anonymous"></script>
  <script src="kton-sdk.global.js"></script>
  <style>
    :root {
      --bg: #f5f7fa; --card: #ffffff; --text: #16202c; --muted: #5b6b7d;
      --line: #dde3ea; --accent: #0a84d6; --accent-text: #ffffff; --error: #c62828;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f151c; --card: #17202a; --text: #e6edf4; --muted: #92a1b1;
        --line: #26323f; --accent: #3aa3ec; --accent-text: #06111b; --error: #ef7a7a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 13px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    select, input, button { font: inherit; border-radius: 8px; border: 1px solid var(--line); padding: 8px 12px; background: var(--bg); color: var(--text); }
    input { flex: 1 1 140px; min-width: 0; }
    button { background: var(--accent); color: var(--accent-text); border: 0; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #status { color: var(--muted); min-height: 1.5em; margin: 12px 0 0; overflow-wrap: anywhere; }
    #status.error { color: var(--error); }
    ul { margin: 0; padding-left: 18px; }
    footer { color: var(--muted); font-size: 13px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <header>
    <h1>KTON SDK demo</h1>
    <div id="connect"></div>
  </header>

  <section>
    <h2>Pool</h2>
    <div class="row" style="margin-bottom:12px">
      <select id="pool" aria-label="Pool">
        <option value="KTON">KTON</option>
        <option value="pKTON">pKTON</option>
      </select>
    </div>
    <dl id="pool-data"><dt>Loading</dt><dd></dd></dl>
  </section>

  <section>
    <h2>Your wallet</h2>
    <dl id="wallet-data"><dt>Not connected</dt><dd></dd></dl>
  </section>

  <section>
    <h2>Stake and unstake</h2>
    <div class="row">
      <input id="amount" inputmode="decimal" placeholder="Amount" aria-label="Amount">
      <button id="stake" type="button" disabled>Stake TON</button>
      <button id="unstake" type="button" disabled>Unstake KTON</button>
    </div>
    <p id="status" role="status"></p>
  </section>

  <footer>
    Unstaking here waits for the end of the round, at no fee.
    <a href="https://github.com/KTON-IO/KTON-SDK">Source and docs</a>
  </footer>
</main>

<script>
  const { KTON, toNano, fromNano } = KTONSDK;
  const $ = (id) => document.getElementById(id);
  const ton = (nano) => Number(fromNano(nano)).toLocaleString("en-US", { maximumFractionDigits: 4 });

  const tonConnect = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: new URL("tonconnect-manifest.json", location.href).href,
    buttonRootId: "connect",
  });
  let kton;

  function rows(dl, entries) {
    dl.replaceChildren(...entries.flatMap(([label, value]) => {
      const dt = document.createElement("dt");
      const dd = document.createElement("dd");
      dt.textContent = label;
      dd.textContent = value;
      return [dt, dd];
    }));
  }

  function status(text, isError = false) {
    $("status").textContent = text;
    $("status").className = isError ? "error" : "";
  }

  async function showPool() {
    kton = new KTON({ pool: $("pool").value, connector: tonConnect });
    const unit = $("pool").value;
    $("unstake").textContent = `Unstake ${unit}`;
    try {
      const [pool, rates, round] = await Promise.all([
        kton.getPoolData(), kton.getRates(), kton.getRoundInfo(),
      ]);
      const entries = [
        ["Staked", `${ton(pool.totalBalance)} TON`],
        [`1 ${unit}`, `${rates.current.toFixed(6)} TON`],
        ["Realized APY", "Measuring"],
        ["Governance fee", `${(pool.governanceFee * 100).toFixed(2)}%`],
        ["Round ends", round.end.toLocaleString()],
        ["Pool validating", round.poolValidating ? "Yes" : "No, resting this round"],
        ["Deposits", pool.depositsOpen && !pool.halted ? "Open" : "Closed"],
      ];
      rows($("pool-data"), entries);
      // The round logs take a few requests; the rest shows meanwhile.
      const current = kton;
      current.getRealizedApy().then((apy) => {
        if (kton !== current) return;
        entries[2][1] = apy ? `${(apy.apy * 100).toFixed(2)}% over ${apy.days.toFixed(0)} days` : "Not enough rounds";
        rows($("pool-data"), entries);
      }, () => {
        entries[2][1] = "Could not measure";
        rows($("pool-data"), entries);
      });
    } catch (error) {
      rows($("pool-data"), [["Could not read the pool", error.message]]);
    }
    await showWallet();
  }

  async function showWallet() {
    const connected = !!tonConnect.account;
    $("stake").disabled = !connected;
    $("unstake").disabled = !connected;
    if (!connected) {
      rows($("wallet-data"), [["Not connected", ""]]);
      return;
    }
    try {
      const [balance, staked, withdrawals] = await Promise.all([
        kton.getBalance(), kton.getStakedBalance(), kton.getWithdrawals(),
      ]);
      const pending = withdrawals.reduce((sum, w) => sum + w.amount, 0n);
      rows($("wallet-data"), [
        ["TON", ton(balance)],
        [kton.pool, ton(staked)],
        ["Waiting for payout", withdrawals.length ? `${ton(pending)} ${kton.pool} in ${withdrawals.length} request(s)` : "None"],
      ]);
    } catch (error) {
      rows($("wallet-data"), [["Could not read the wallet", error.message]]);
    }
  }

  async function send(action) {
    let amount;
    try {
      amount = toNano($("amount").value.trim());
    } catch {
      amount = 0n;
    }
    if (amount <= 0n) return status("Enter an amount such as 1.5", true);
    status("Confirm in your wallet");
    try {
      await (action === "stake" ? kton.stake(amount) : kton.unstake(amount));
      status("Sent. Balances update once the transaction lands.");
      setTimeout(showWallet, 20_000);
    } catch (error) {
      status(error.message, true);
    }
  }

  $("stake").addEventListener("click", () => send("stake"));
  $("unstake").addEventListener("click", () => send("unstake"));
  $("pool").addEventListener("change", showPool);
  tonConnect.onStatusChange(showWallet);
  showPool();
</script>
</body>
</html>
